[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqroute-tc"
version = "0.1.0"
description = "Uncertainty-gated small-model routing for robust LLM tool calling"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Ravindra Siva Sai Kumar Medicharla" }
]
dependencies = [
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
analysis = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4"
]
client = [
    "openai>=1.50,<3",
    "tqdm>=4.66,<5"
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]